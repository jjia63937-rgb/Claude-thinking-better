name: Android APK

# Build the virtual-location app and publish the debug APK as a workflow artifact.
on:
  push:
    paths:
      - 'virtual-location/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'virtual-location/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtual-location
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-location-apk
          path: virtual-location/app/build/outputs/apk/debug/app-debug.apk
