name: Release

# Publish a GitHub Release with the packaged skills attached.
# Either push a tag (git tag v1.2.0 && git push origin v1.2.0) or run this
# workflow from the Actions tab and enter the version. The version must match
# .claude-plugin/marketplace.json and have a section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate and package skills
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/package.py --check-version "$TAG"

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.skill dist/*.zip \
            --title "Claude-thinking-better $TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
