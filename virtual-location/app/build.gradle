plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.virtuallocation'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.virtuallocation'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenStreetMap tiles: no API key needed.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // Lets apps that read Google Play services' fused location see the mock too.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
